services:
  postgres:
    image: postgres:16-alpine
    container_name: url_shortener_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
      POSTGRES_USER: ${POSTGRES_USER:-url_shortener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - url_shortener_network

  redis:
    image: redis:7-alpine
    container_name: url_shortener_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - url_shortener_network

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url_shortener_migration
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-url_shortener}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - url_shortener_network

  api-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url_shortener_api_1
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-url_shortener}
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-[]}"
      ANALYTICS_STREAM_NAME: url_shortener:redirect_events
      ANALYTICS_CONSUMER_GROUP: url_shortener:redirect_analytics
      ANALYTICS_STREAM_MAXLEN: 100000
      ANALYTICS_DLQ_STREAM_NAME: url_shortener:redirect_events:dlq
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - url_shortener_network

  api-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url_shortener_api_2
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-url_shortener}
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-[]}"
      ANALYTICS_STREAM_NAME: url_shortener:redirect_events
      ANALYTICS_CONSUMER_GROUP: url_shortener:redirect_analytics
      ANALYTICS_STREAM_MAXLEN: 100000
      ANALYTICS_DLQ_STREAM_NAME: url_shortener:redirect_events:dlq
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - url_shortener_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: url_shortener_worker
    restart: unless-stopped
    command: ["python", "-m", "url_shortener.services.analytics_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-url_shortener}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-url_shortener}
      REDIS_URL: redis://redis:6379/0
      ANALYTICS_STREAM_NAME: url_shortener:redirect_events
      ANALYTICS_CONSUMER_GROUP: url_shortener:redirect_analytics
      ANALYTICS_CONSUMER_NAME: worker-1
      ANALYTICS_DLQ_STREAM_NAME: url_shortener:redirect_events:dlq
      ANALYTICS_MAX_RETRIES: 3
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - url_shortener_network

  load_balancer:
    image: nginx:alpine
    container_name: url_shortener_load_balancer
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - url_shortener_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: url_shortener_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - url_shortener_network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: url_shortener_prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-1
      - api-2
    networks:
      - url_shortener_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: url_shortener_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your root .env file}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - url_shortener_network

volumes:
  postgres_data:
  redis_data:

networks:
  url_shortener_network:
    driver: bridge

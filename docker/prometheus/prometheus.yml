global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "url_shortener_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-1:8000", "api-2:8000"]
        labels:
          group: "backend_cluster"

  - job_name: "url_shortener_worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:8000"]
        labels:
          group: "analytics_worker"
